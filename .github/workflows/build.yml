name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Build APK
        uses: ArtemGrigor/buildozer-action@v1
        with:
          command: android debug
          workdir: .
